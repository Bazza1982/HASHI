name: Windows runtime contract
'on':
  push:
    branches:
    - main
  pull_request: {}
  workflow_dispatch:
    inputs:
      full:
        description: Run all retained checks for a stable major/cross-domain candidate
        type: boolean
        required: false
        default: true
permissions:
  contents: read
jobs:
  ci-plan:
    name: Select necessary checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      architecture: ${{ steps.scope.outputs.architecture }}
      frontend: ${{ steps.scope.outputs.frontend }}
      telegram: ${{ steps.scope.outputs.telegram }}
      voice: ${{ steps.scope.outputs.voice }}
      native: ${{ steps.scope.outputs.native }}
      full_suite: ${{ steps.scope.outputs.full_suite }}
      permission: ${{ steps.scope.outputs.permission }}
      windows: ${{ steps.scope.outputs.windows }}
      nagare_python: ${{ steps.scope.outputs.nagare_python }}
      nagare_viz: ${{ steps.scope.outputs.nagare_viz }}
      full: ${{ steps.scope.outputs.full }}
      linux_os: ${{ steps.scope.outputs.linux_os }}
      python_versions: ${{ steps.scope.outputs.python_versions }}
      node_versions: ${{ steps.scope.outputs.node_versions }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Verify selection and failure contracts
      run: python -B -m unittest discover -s .github -p test_ci_plan.py -q
    - name: Select checks from actual impact
      id: scope
      run: python .github/ci_plan.py plan
  native-windows:
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        python-version:
        - 3.12.13
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: astral-sh/setup-uv@v6
    - name: Prepare the declared Python runtime
      shell: bash
      run: |
        uv venv --seed --python "${{ matrix.python-version }}" .venv
        if [ "$RUNNER_OS" = "Windows" ]; then
          echo "$GITHUB_WORKSPACE/.venv/Scripts" >> "$GITHUB_PATH"
        else
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
        fi
    - name: Install runtime and test dependencies
      run: python -m pip install -r constraints/standard-py312.lock ".[test]"
    - name: Verify Agent tool ownership, runtime ACL and protection
      run: python -m pytest -q tests/test_mcp_owner_admission.py tests/test_tool_gateway_mcp.py
        tests/test_live_runtime_acl.py tests/test_live_runtime_protection.py tests/test_smart_tool_registry.py
        tests/test_browser_gateway_proxy.py tests/test_hashi_instance_cli.py
    - name: Verify native patch integrity and shared approval wiring
      run: python -m pytest -q tests/test_apply_patch_cross_platform.py tests/test_fingerprint_execution.py tests/test_live_voice_actions.py
        tests/test_permission_api_decisions.py tests/test_permission_frontend_decisions.py tests/test_permission_model_broker.py
    - name: Verify native Windows runtime and portable startup contracts
      run: python -m pytest -q tests/test_runtime_contract.py tests/test_function_generation.py tests/test_process_execution.py
        tests/test_agent_pcm_edit.py tests/test_agent_pcm_api.py tests/test_pcm_audit_memory_wiki.py::test_canonical_audit_record_many_uses_one_durable_commit_and_keeps_chain
        tests/test_pcm_audit_memory_wiki.py::test_canonical_audit_fails_fast_when_durable_store_is_unavailable tests/test_runtime_pipeline.py::test_reasoning_stream_audit_batches_without_copying_raw_delta
        tests/test_portable_bootstrap_failure_details.py tests/test_portable_windows_packaging.py tests/test_workbench_auth_windows.py
    - name: Quarantine wheel-build metadata before real entry qualification
      shell: python
      run: |
        import os, shutil, subprocess
        from pathlib import Path

        metadata = Path("hashi_bridge.egg-info")
        if metadata.exists():
            if subprocess.check_output(["git", "ls-files", "--", metadata.name]).strip():
                raise RuntimeError("Refusing to move tracked package metadata")
            destination = Path(os.environ["RUNNER_TEMP"]) / "hashi-entry-build-metadata" / metadata.name
            if destination.exists():
                raise RuntimeError("Preserve the existing build-metadata evidence")
            destination.parent.mkdir(parents=True, exist_ok=True)
            shutil.move(str(metadata), str(destination))
            print("Retained source-wheel metadata outside the qualified entry tree:", destination)
    - name: Verify sealed Core and Functions runtime roles
      timeout-minutes: 30
      run: python -m pytest -q tests/test_runtime_roles.py tests/test_runtime_installation.py tests/test_runtime_role_profiles.py
        tests/test_runtime_process.py tests/test_runtime_admission_failures.py tests/test_kernel_cancellation.py
        tests/test_runtime_builder_safety.py tests/test_runtime_role_native.py --basetemp="${{ runner.temp }}/hashi-qualified-runtime-roles"
        --junitxml="${{ runner.temp }}/hashi-runtime-roles.xml" --durations=20
    - name: Verify the complete offline dependency regression scope
      timeout-minutes: 90
      run: python -m pytest -q tests -m "not contract and not live and not platform and not real_wall_clock" --basetemp="${{
        runner.temp }}/hashi-offline-regression" --junitxml="${{ runner.temp }}/hashi-offline-regression.xml" --durations=25
      if: ${{ needs.ci-plan.outputs.full == 'true' }}
    - name: Retain native role qualification receipts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: native-runtime-roles-${{ matrix.python-version }}
        if-no-files-found: warn
        path: |
          ${{ runner.temp }}/hashi-runtime-roles.xml
          ${{ runner.temp }}/hashi-qualified-runtime-roles/**/runtime-role-qualification.json
          ${{ runner.temp }}/hashi-qualified-runtime-roles/**/functions-dependency-handoff.json
          ${{ runner.temp }}/hashi-qualified-runtime-roles/**/real-entry-help.json
          ${{ runner.temp }}/hashi-qualified-runtime-roles/**/real-entry-cold-receipt.json
          ${{ runner.temp }}/hashi-qualified-runtime-roles/**/real-entry-cold.log
          ${{ runner.temp }}/hashi-entry-build-metadata/**
          ${{ runner.temp }}/hashi-offline-regression.xml
    needs:
    - ci-plan
    if: ${{ needs.ci-plan.result == 'success' && needs.ci-plan.outputs.native == 'true' }}
  posix-runtime:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: astral-sh/setup-uv@v6
    - name: Prepare the declared Linux Python runtime
      shell: bash
      run: |
        uv venv --seed --python "3.12.13" .venv
        echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
    - name: Install original runtime and test dependencies
      run: python -m pip install -r constraints/standard-py312.lock ".[test]"
    - name: Verify Agent tool ownership, runtime ACL and protection
      run: python -m pytest -q tests/test_mcp_owner_admission.py tests/test_tool_gateway_mcp.py
        tests/test_live_runtime_acl.py tests/test_live_runtime_protection.py tests/test_smart_tool_registry.py
        tests/test_browser_gateway_proxy.py tests/test_hashi_instance_cli.py
    - name: Quarantine wheel-build metadata before real entry qualification
      shell: python
      run: |
        import os, shutil, subprocess
        from pathlib import Path

        metadata = Path("hashi_bridge.egg-info")
        if metadata.exists():
            if subprocess.check_output(["git", "ls-files", "--", metadata.name]).strip():
                raise RuntimeError("Refusing to move tracked package metadata")
            destination = Path(os.environ["RUNNER_TEMP"]) / "hashi-entry-build-metadata" / metadata.name
            if destination.exists():
                raise RuntimeError("Preserve the existing build-metadata evidence")
            destination.parent.mkdir(parents=True, exist_ok=True)
            shutil.move(str(metadata), str(destination))
            print("Retained source-wheel metadata outside the qualified entry tree:", destination)
    - name: Verify Linux sealed roles, private IPC and same-Core dependency handoff
      run: python -m pytest -q tests/test_runtime_roles.py tests/test_runtime_installation.py tests/test_runtime_role_profiles.py
        tests/test_runtime_process.py tests/test_runtime_admission_failures.py tests/test_kernel_cancellation.py
        tests/test_runtime_builder_safety.py tests/test_runtime_role_native.py --basetemp="${{ runner.temp }}/hashi-qualified-linux-roles"
        --junitxml="${{ runner.temp }}/hashi-linux-runtime-roles.xml" --durations=20
    - name: Verify Backend mutation authentication and Run lifecycle on Linux
      run: python -m pytest -q tests/test_backend_mutation_authorization.py tests/test_scheduler_missed_recovery.py
        tests/test_superloop_commands.py tests/test_scheduler_run_authorization.py tests/test_workbench_scheduler_api.py
        tests/test_session_store.py tests/test_frontend_settings_api.py tests/test_permission_pao_fence.py --junitxml="${{
        runner.temp }}/hashi-linux-scheduler-authorization.xml"
    - name: Verify existing curated Core contracts on Linux
      run: python -m pytest -q --junitxml="${{ runner.temp }}/hashi-linux-core.xml"
    - name: Retain Linux qualification receipts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: linux-runtime-roles-3.12.13
        if-no-files-found: warn
        path: |
          ${{ runner.temp }}/hashi-linux-runtime-roles.xml
          ${{ runner.temp }}/hashi-linux-scheduler-authorization.xml
          ${{ runner.temp }}/hashi-linux-core.xml
          ${{ runner.temp }}/hashi-qualified-linux-roles/**/runtime-role-qualification.json
          ${{ runner.temp }}/hashi-qualified-linux-roles/**/functions-dependency-handoff.json
          ${{ runner.temp }}/hashi-qualified-linux-roles/**/real-entry-help.json
          ${{ runner.temp }}/hashi-entry-build-metadata/**
    needs:
    - ci-plan
    if: ${{ needs.ci-plan.result == 'success' && needs.ci-plan.outputs.native == 'true' }}
  ci-result:
    name: Windows runtime contract result
    if: ${{ always() }}
    needs:
    - ci-plan
    - native-windows
    - posix-runtime
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Require actual success of every selected check
      env:
        CI_NEEDS: ${{ toJSON(needs) }}
      run: python .github/ci_plan.py summary --jobs '{"native-windows":"native","posix-runtime":"native"}'
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
