      - "orchestrator/runtime_pipeline.py"
      - "orchestrator/workzone.py"
      - "tools/builtins.py"
      - "tools/her_verification.py"
      - "tools/registry.py"
      - "tools/schemas.py"
      - "tests/test_process_execution.py"
      - "tests/test_function_generation.py"
      - "tests/test_runtime_contract.py"
      - "constraints/standard-py312.lock"
      - "pyproject.toml"
      - ".github/workflows/windows-runtime-contract.yml"

permissions:
  contents: read

jobs:
  native-windows:
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12.13"]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Managed CPython also supplies Windows security-only patch releases
      # that are absent from actions/python-versions.
      - uses: astral-sh/setup-uv@v6
      - name: Prepare the declared Python runtime
        shell: bash
        run: |
          uv venv --seed --python "${{ matrix.python-version }}" .venv
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "$GITHUB_WORKSPACE/.venv/Scripts" >> "$GITHUB_PATH"
          else
            echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
          fi
      - name: Install runtime and test dependencies
        run: python -m pip install -r constraints/standard-py312.lock ".[test]"
      - name: Verify native patch integrity and shared approval wiring
        run: >-
          python -m pytest -q
          tests/test_apply_patch_cross_platform.py
          tests/test_fingerprint_execution.py
          tests/test_live_voice_actions.py
          tests/test_permission_api_decisions.py
          tests/test_permission_frontend_decisions.py
          tests/test_permission_model_broker.py
      - name: Verify native Windows runtime and portable startup contracts
        run: >-
          python -m pytest -q
          tests/test_runtime_contract.py
          tests/test_function_generation.py
          tests/test_process_execution.py
          tests/test_agent_pcm_edit.py
          tests/test_agent_pcm_api.py
          tests/test_pcm_audit_memory_wiki.py::test_canonical_audit_record_many_uses_one_durable_commit_and_keeps_chain
          tests/test_pcm_audit_memory_wiki.py::test_canonical_audit_fails_fast_when_durable_store_is_unavailable
          tests/test_runtime_pipeline.py::test_reasoning_stream_audit_batches_without_copying_raw_delta
          tests/test_portable_bootstrap_failure_details.py
          tests/test_portable_windows_packaging.py


      - name: Verify sealed Core and Functions runtime roles
        timeout-minutes: 30
        run: >-
          python -m pytest -q
          tests/test_runtime_roles.py
          tests/test_runtime_installation.py
          tests/test_runtime_role_profiles.py
          tests/test_runtime_process.py
          tests/test_runtime_admission_failures.py
          tests/test_kernel_cancellation.py
          tests/test_runtime_builder_safety.py
          tests/test_runtime_role_native.py
          --basetemp="${{ runner.temp }}/hashi-qualified-runtime-roles"
          --junitxml="${{ runner.temp }}/hashi-runtime-roles.xml"
          --durations=20
      - name: Verify the complete offline dependency regression scope
        timeout-minutes: 90
        run: >-
          python -m pytest -q tests
          -m "not contract and not live and not platform and not real_wall_clock"
          --basetemp="${{ runner.temp }}/hashi-offline-regression"
          --junitxml="${{ runner.temp }}/hashi-offline-regression.xml"
          --durations=25
      - name: Retain native role qualification receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-runtime-roles-${{ matrix.python-version }}
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/hashi-runtime-roles.xml
            ${{ runner.temp }}/hashi-qualified-runtime-roles/**/runtime-role-qualification.json
            ${{ runner.temp }}/hashi-qualified-runtime-roles/**/functions-dependency-handoff.json
            ${{ runner.temp }}/hashi-offline-regression.xml

  posix-runtime:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: Prepare the declared Linux Python runtime
        shell: bash
        run: |
          uv venv --seed --python "3.12.13" .venv
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - name: Install original runtime and test dependencies
        run: python -m pip install -r constraints/standard-py312.lock ".[test]"
      - name: Verify Linux sealed roles, private IPC and same-Core dependency handoff
        run: >-
          python -m pytest -q
          tests/test_runtime_roles.py
          tests/test_runtime_installation.py
          tests/test_runtime_role_profiles.py
          tests/test_runtime_process.py
          tests/test_runtime_admission_failures.py
          tests/test_kernel_cancellation.py
          tests/test_runtime_builder_safety.py
          tests/test_runtime_role_native.py
          --basetemp="${{ runner.temp }}/hashi-qualified-linux-roles"
          --junitxml="${{ runner.temp }}/hashi-linux-runtime-roles.xml"
          --durations=20
      - name: Verify existing curated Core contracts on Linux
        run: python -m pytest -q --junitxml="${{ runner.temp }}/hashi-linux-core.xml"
      - name: Retain Linux qualification receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-runtime-roles-3.12.13
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/hashi-linux-runtime-roles.xml
            ${{ runner.temp }}/hashi-linux-core.xml
            ${{ runner.temp }}/hashi-qualified-linux-roles/**/runtime-role-qualification.json
            ${{ runner.temp }}/hashi-qualified-linux-roles/**/functions-dependency-handoff.json
