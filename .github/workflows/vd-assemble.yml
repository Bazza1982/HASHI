name: Assemble virtual desktop candidate
on:
  push:
    branches: [feature-virtual-desktop]
    paths: ['.github/workflows/vd-assemble.yml']
permissions:
  contents: write
concurrency:
  group: virtual-desktop-assembly
  cancel-in-progress: false
jobs:
  assemble:
    if: github.repository == 'Bazza1982/HASHI' && github.ref == 'refs/heads/feature-virtual-desktop'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feature-virtual-desktop
          fetch-depth: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify and apply exact tested delta
        run: |
          python - <<'PY'
          import base64, gzip, hashlib, pathlib, subprocess
          root = pathlib.Path('.virtual-desktop-assembly')
          part = root / 'part2.b64'
          value = part.read_text()
          value = value.replace('nDc9pz9q93q93qzh', 'nDc9pz9q93qzh').replace('1g+6NemT2ix', '1g+6NemN2ix').replace('T6jebEbzYicPZs', 'T6jebEbzYzG9icPZs')
          part.write_text(value)
          text = ''.join((root / f'part{i}.b64').read_text().strip() for i in range(1, 5))
          patch = gzip.decompress(base64.b64decode(text, validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'c8a47e000c4356a6016e2c0eb52cb11c2c5023cd0cf1127875fb27b4d445a037', 'delta checksum mismatch'
          pathlib.Path('/tmp/virtual-desktop.patch').write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', '/tmp/virtual-desktop.patch'], check=True)
          subprocess.run(['git', 'apply', '/tmp/virtual-desktop.patch'], check=True)
          PY
      - run: python -m pip install pytest==9.0.2 pytest-asyncio==1.3.0 anyio==4.13.0 aiohttp==3.13.3 pillow==12.3.0 PyYAML==6.0.3 httpx==0.28.1 rich==15.0.0
      - name: Focused contract and integration tests
        run: |
          python -m pytest -q tests/test_desktop_session.py tests/test_capability_broker.py tests/test_device_control_worker.py tests/test_config.py
          python scripts/check_protected_core_changes.py
          git diff --check
      - name: Commit product source only to feature branch
        run: |
          test "${GITHUB_REF}" = refs/heads/feature-virtual-desktop
          rm -rf .virtual-desktop-assembly
          git restore --source=HEAD --staged --worktree .github/workflows
          rm -f .github/workflows/virtual-desktop.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --name-only | grep -q '^orchestrator/desktop_api.py$'
          test -z "$(git diff --cached --name-only -- .github/workflows)"
          git commit -m 'feat(desktop): bounded Windows preview and manual control over existing connector'
          git push origin HEAD:refs/heads/feature-virtual-desktop
          git rev-parse HEAD
      - name: Preserve source-only diagnostics on failure
        if: failure()
        run: |
          mkdir -p assembly-debug
          cp .virtual-desktop-assembly/*.b64 assembly-debug/ || true
          git diff > assembly-debug/current.diff
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: virtual-desktop-assembly-debug
          path: assembly-debug
          retention-days: 1
