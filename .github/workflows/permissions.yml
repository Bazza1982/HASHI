permissions:
  contents: read

jobs:
  permission-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: Prepare Python
        shell: bash
        run: |
          uv venv --seed --python "3.12.13" .venv
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "$GITHUB_WORKSPACE/.venv/Scripts" >> "$GITHUB_PATH"
          else
            echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
          fi
      - name: Install test dependencies
        run: python -m pip install -r constraints/standard-py312.lock ".[test]" ruff
      - name: Validate Protected Core manifest
        run: python scripts/check_protected_core_changes.py --validate-manifest
      - name: Verify Protected Core against the event baseline
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || (github.ref != 'refs/heads/main' && 'origin/main') || github.event.before }}
          CORE_CHANGE_APPROVED: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'core-change-approved') }}
        run: |
          core_args=()
          if [ "$CORE_CHANGE_APPROVED" = "true" ]; then
            core_args+=(--authorized --major-version-change)
          fi
          core_base_ref="${BASE_SHA:-origin/main}"
          if [ "$core_base_ref" = 0000000000000000000000000000000000000000 ]; then
            core_base_ref=origin/main
          fi
          python scripts/check_protected_core_changes.py --base "$core_base_ref" "${core_args[@]}"
      - name: Check focused code
        run: >-
          python -m ruff check orchestrator/permissions orchestrator/config.py
          orchestrator/commands/safety.py orchestrator/command_registry.py orchestrator/session_store.py
          orchestrator/runtime_menu_views.py
          tests/test_permission_safety_command.py tests/test_permission_frontend_views.py tests/test_safety_failure_details.py
          tests/test_command_registry.py tests/test_permission_pao_fence.py
          orchestrator/enterprise/identity.py tests/test_permission_enterprise_decisions.py
