permissions:
  contents: read

jobs:
  permission-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Prepare Python
        shell: bash
        run: |
          uv venv --seed --python "3.12.13" .venv
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "$GITHUB_WORKSPACE/.venv/Scripts" >> "$GITHUB_PATH"
          else
            echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
          fi
      - name: Install test dependencies
        run: python -m pip install -r constraints/standard-py312.lock ".[test]" ruff
      - name: Check focused code
        run: >-
          python -m ruff check orchestrator/permissions orchestrator/config.py
          orchestrator/commands/safety.py orchestrator/command_registry.py orchestrator/session_store.py
          orchestrator/runtime_menu_views.py
          tests/test_permission_safety_command.py tests/test_permission_frontend_views.py
          tests/test_command_registry.py tests/test_permission_pao_fence.py
          orchestrator/enterprise/identity.py tests/test_permission_enterprise_decisions.py
          adapters/her_v2_provider.py tools/request_access.py
          scripts/permissions/windows_appcontainer_probe.py
          scripts/permissions/windows_test_identity.py tests/test_permission_test_identity.py
          scripts/permissions/windows_test_profile.py tests/test_permission_test_profile.py
          scripts/permissions/windows_trusted_bootstrap.py
          scripts/permissions/windows_probe_staging.py tests/test_permission_probe_staging.py
          scripts/permissions/windows_probe_process.py tests/test_permission_probe_process.py
          tests/test_permission_capabilities.py
          tests/test_permission_agent_tools.py tests/test_permission_wait.py
          tests/test_permission_execution_gate.py tests/test_permission_registry.py tests/test_permissions_authority.py
          tests/test_permission_signed_receipts.py tests/test_permission_actions.py
          tests/test_permission_windows_file_binding.py tests/test_permission_windows_supervisor.py
          tests/test_permissions_service_recovery.py
          tests/test_permissions_outcome_recovery.py
          tests/test_permissions_guarded_dispatch.py tests/test_permissions_result_store.py
          tests/test_permissions_config.py tests/test_permissions_descriptors.py
          tests/test_permissions_l0_baseline.py tests/test_permissions_models.py
          tests/test_permissions_requests.py tests/test_permissions_runtime_guard.py
          tests/test_permission_api_decisions.py
          tests/test_permission_baseline.py
          tests/test_permission_decision_commands.py
          tests/test_permission_frontend_decisions.py
          tests/test_permission_her_adoption.py
          tests/test_permission_model_broker.py
          tests/test_permission_parking.py
          tests/test_permission_private_rpc.py
          tests/test_permission_provider_park.py
          tests/test_permission_restricted_her.py
          tests/test_permission_run_service.py
          tests/test_permission_service_application.py
          tests/test_permission_resource_cleanup.py
          tests/test_permission_configured_models.py
          tests/test_permission_level_transition.py
          tests/test_permission_capsule.py
          tests/test_permission_installed_boundaries.py
          tests/test_permission_start_wait.py
          tests/test_permission_physical_journal.py
          tests/test_permission_running_claim.py
          tests/test_permission_runtime_context.py
          tests/test_permission_windows_ipc.py
          tests/test_permission_windows_token.py
          orchestrator/her_v2/provider_continuation.py scripts/permissions/windows_lpac_probe.py
          scripts/permissions/windows_file_helper_probe.py
          scripts/permissions/build_runtime_capsule.py
      - name: Check backend manager against its existing import baseline
        run: python -m ruff check orchestrator/flexible_backend_manager.py --ignore E402
      - name: Test permission and legacy contracts
        run: >-
          python -m pytest -q
          tests/test_permission_agent_tools.py
          tests/test_permission_safety_command.py
          tests/test_permission_frontend_views.py
          tests/test_permission_pao_fence.py
          tests/test_session_store.py
          tests/test_command_registry.py
          tests/test_command_presentation_recovery.py
          tests/test_command_menu_notify_integration.py
          tests/test_permission_wait.py
          tests/test_permission_execution_gate.py
          tests/test_permission_registry.py
          tests/test_permission_test_identity.py
          tests/test_permission_test_profile.py
          tests/test_permission_probe_staging.py
          tests/test_permission_probe_process.py
          tests/test_permission_capabilities.py
          tests/test_permission_actions.py
          tests/test_permission_enterprise_decisions.py
          tests/test_enterprise_identity.py
