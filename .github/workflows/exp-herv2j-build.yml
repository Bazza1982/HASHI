name: HERv2J isolated workspace
on:
  push:
    branches: [exp-herv2j]
    paths: [.github/workflows/exp-herv2j-build.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Export experiment source
        run: git archive --format=zip HEAD -o /tmp/hashi-exp-source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: hashi-exp-source
          path: /tmp/hashi-exp-source.zip
          retention-days: 1
