name: Demo source preparation
on:
  push:
    branches: [feature/demo-mode-20260920]
    paths: [.github/workflows/demo-source-preparation.yml]
permissions:
  contents: read
jobs:
  tracked-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive tracked source only for isolated development
        run: git archive --format=tar.gz --output="$RUNNER_TEMP/demo-source.tar.gz" HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: demo-source-preparation
          path: ${{ runner.temp }}/demo-source.tar.gz
          retention-days: 1
