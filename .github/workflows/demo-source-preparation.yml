name: Demo Connector

on:
  push:
    branches: [feature/demo-mode-20260920]
    paths:
      - 'orchestrator/demo/**'
      - 'orchestrator/session_store.py'
      - 'orchestrator/workbench_api.py'
      - 'tests/test_demo_connector.py'
      - 'docs/demo-mode/**'
      - '.github/workflows/demo-source-preparation.yml'
  pull_request:
    paths:
      - 'orchestrator/demo/**'
      - 'orchestrator/session_store.py'
      - 'orchestrator/workbench_api.py'
      - 'tests/test_demo_connector.py'

permissions:
  contents: read

concurrency:
  group: demo-connector-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.13"
      - name: Install isolated test dependencies
        run: python -m pip install -r constraints/standard-py312.lock ".[test]" ruff
      - name: Protected Core guard
        run: |
          python scripts/check_protected_core_changes.py --validate-manifest
          python scripts/check_protected_core_changes.py --base origin/main
          git diff --check origin/main HEAD
      - name: Lint Demo Connector
        run: python -m ruff check orchestrator/demo tests/test_demo_connector.py
      - name: Focused Demo tests
        run: python -m pytest -q tests/test_demo_connector.py tests/test_session_api.py
