name: Virtual desktop focused checks
on:
  push:
    branches: [feature-virtual-desktop]
    paths: ['orchestrator/desktop*.py', 'tools/desktop_session.py', 'tools/windows_helper/desktop_capture.py', 'tools/device_control_worker.py', 'orchestrator/capability_broker.py', 'orchestrator/workbench_api.py', 'orchestrator/config.py', 'remote/api/server.py', 'tests/test_desktop_session.py', '.github/workflows/virtual-desktop.yml']
  pull_request:
    paths: ['orchestrator/desktop*.py', 'tools/desktop_session.py', 'tools/windows_helper/desktop_capture.py', 'tools/device_control_worker.py', 'orchestrator/capability_broker.py', 'tests/test_desktop_session.py']
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install pytest==9.0.2 pytest-asyncio==1.3.0 anyio==4.13.0 aiohttp==3.13.3 pillow==12.3.0 PyYAML==6.0.3 httpx==0.28.1 rich==15.0.0
      - run: python -m pytest -q tests/test_desktop_session.py tests/test_capability_broker.py tests/test_device_control_worker.py tests/test_config.py
      - run: python scripts/check_protected_core_changes.py
