name: Normalize call PRD source formatting
on:
  push:
    branches: [feature-call]
    paths: ['.github/workflows/feature-call-install.yml']
permissions:
  contents: write
jobs:
  normalize:
    if: github.repository == 'Bazza1982/HASHI' && github.ref == 'refs/heads/feature-call'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature-call
          fetch-depth: 0
      - name: Preserve Markdown line breaks without trailing whitespace
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = feature-call
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/call/HASHI_Call_PRD_2026-10-03.md')
          lines = p.read_text().splitlines()
          p.write_text('\n'.join(line.rstrip() + ('<br>' if line.endswith('  ') else '') for line in lines) + '\n')
          PY
          git add docs/call/HASHI_Call_PRD_2026-10-03.md
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs(call): preserve PRD hard breaks without whitespace errors'
          git push origin HEAD:refs/heads/feature-call
          git diff --check 6a4b29b881dd3077c1c2302e4bbc6e41b0277bf9
