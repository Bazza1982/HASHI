name: Apply HER v3 handoff

on:
  push:
    branches: [exp-herv3-handoff]
    paths:
      - '.herv3.parts/**'
      - '.github/workflows/apply-herv3-handoff.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize HER v3 branch
        shell: bash
        run: |
          set -euo pipefail

          cat .herv3.parts/00 .herv3.parts/01 .herv3.parts/02 .herv3.parts/03 .herv3.parts/04             > "$RUNNER_TEMP/herv3.patch.gz.b64"
          base64 -d "$RUNNER_TEMP/herv3.patch.gz.b64" | gzip -d             > "$RUNNER_TEMP/herv3.patch"

          git fetch origin exp-herv2j
          git checkout -B exp-herv3 origin/exp-herv2j

          git apply --check "$RUNNER_TEMP/herv3.patch"
          git apply "$RUNNER_TEMP/herv3.patch"

          python -m compileall -q             orchestrator/her_v2             adapters/her_v2.py             adapters/her_v2_provider.py             adapters/her_jev.py             orchestrator/flexible_backend_registry.py

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(her-v3): simplify runtime around model-native reasoning"
          git push origin HEAD:refs/heads/exp-herv3
