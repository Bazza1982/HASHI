name: Architecture boundaries

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate protected-core manifest
        run: python scripts/check_protected_core_changes.py --validate-manifest
      - name: Enforce protected-core approval on pull requests
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CORE_CHANGE_APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'core-change-approved') }}
        run: |
          if [ "$CORE_CHANGE_APPROVED" = "true" ]; then
            python scripts/check_protected_core_changes.py --base "$BASE_SHA" --authorized
          else
            python scripts/check_protected_core_changes.py --base "$BASE_SHA"
          fi
      - name: Flag protected-core edits pushed directly to main
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        env:
          BASE_SHA: ${{ github.event.before }}
        run: python scripts/check_protected_core_changes.py --base "$BASE_SHA"
      - name: Run architecture contract tests
        run: |
          python -m pip install -r requirements.txt pytest
          python -m pytest -q \
            tests/test_architecture_boundaries.py \
            tests/test_check_protected_core_changes.py \
            tests/test_hot_reload.py \
            tests/test_instance_lock_scope.py \
            tests/test_manager_registry.py \
            tests/test_model_catalog.py \
            tests/test_runtime_command_binding.py \
            tests/test_runtime_groups.py \
            tests/test_runtime_usage.py \
            tests/test_runtime_wol.py \
            tests/test_workspace_state.py
