name: Simple upgrade checks
on:
  push:
    branches: [simple-upgrade]
permissions:
  contents: read
concurrency:
  group: simple-upgrade-hashi
  cancel-in-progress: true
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
      - name: Install focused test dependencies
        run: python -m pip install -r constraints/standard-py312.lock ".[test]"
      - name: Compile and run focused integration checks
        run: python scripts/check_embedded_browser.py
      - name: Record tested source revision
        if: always()
        run: git rev-parse HEAD
