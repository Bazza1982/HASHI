name: HCC verified implementation delivery

on:
  push:
    branches: [feature-hcc]
    paths:
      - '.github/hcc-patch/**'
      - '.github/workflows/hcc-apply.yml'

permissions:
  contents: read

concurrency:
  group: hcc-delivery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'Bazza1982/HASHI' && github.ref == 'refs/heads/feature-hcc'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - name: Provision isolated CPython 3.12.13
        run: |
          uv venv --seed --python 3.12.13 .venv
          if [ "$RUNNER_OS" = Windows ]; then
            echo "$GITHUB_WORKSPACE/.venv/Scripts" >> "$GITHUB_PATH"
          else
            echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
          fi
      - name: Apply the digest-verified sandbox patch
        run: python .github/hcc-patch/apply_patch.py
      - name: Install isolated runner dependencies
        run: python -m pip install -r constraints/standard-py312.lock '.[test]' ruff
      - name: Protected Core and whitespace guards
        run: |
          python scripts/check_protected_core_changes.py
          git diff --check
      - name: Lint executable changes
        run: >-
          python -m ruff check orchestrator/hcc.py orchestrator/runtime_hcc.py
          orchestrator/pcm.py orchestrator/config_json.py orchestrator/bridge_memory.py
          adapters/her_v2.py orchestrator/command_specs.py orchestrator/flexible_agent_runtime.py
          tests/test_hcc.py tests/test_hcc_integration.py tests/test_runtime_pipeline.py
          tests/test_agent_move_package.py skills/hcc-refresh/scripts/hcc_update.py
      - name: HCC and related component contracts
        run: >-
          python -m pytest -q --junitxml=hcc-results.xml
          tests/test_hcc.py tests/test_hcc_integration.py
          tests/test_pcm_upgrade_contract.py tests/test_pcm_fixed_gateway.py tests/test_pcm_transfer.py
          tests/test_her_v2_fixed_backend.py tests/test_config_json.py tests/test_workspace_state.py
          tests/test_command_registry.py tests/test_ui_language.py tests/test_runtime_command_binding.py
          tests/test_runtime_pipeline.py tests/test_scheduler_backend_inheritance.py
          tests/test_scheduler_persistence.py tests/test_skill_manager_standard.py
          tests/test_runtime_skill_commands.py tests/test_runtime_skill_callbacks.py tests/test_agent_move_package.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hcc-contract-${{ matrix.os }}
          path: hcc-results.xml
          if-no-files-found: warn
          retention-days: 7

  publish:
    needs: verify
    if: github.repository == 'Bazza1982/HASHI' && github.ref == 'refs/heads/feature-hcc'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Publish only the verified implementation to its feature branch
        env:
          EXPECTED_HEAD: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/feature-hcc | cut -f1)" = "$EXPECTED_HEAD"
          python3 .github/hcc-patch/apply_patch.py
          git rm -r .github/hcc-patch
          git add adapters/her_v2.py docs/AGENT_FYI.md docs/HASHI_HCC_IMPLEMENTATION.md docs/HASHI_PCM_SYSTEM_DESIGN.md docs/HASHI_PCM_UPGRADE_TEST_PLAN.md locales/runtime/en.json locales/runtime/zh-CN.json orchestrator/bridge_memory.py orchestrator/command_specs.py orchestrator/config_json.py orchestrator/flexible_agent_runtime.py orchestrator/hcc.py orchestrator/pcm.py orchestrator/runtime_hcc.py skills/hcc-refresh tests/test_agent_move_package.py tests/test_hcc.py tests/test_hcc_integration.py tests/test_runtime_pipeline.py
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(pcm): add per-turn HASHI Context Cache with safe scheduled refresh' -m "Verified on Linux and Windows: $RUN_URL" -m 'Sandbox patch SHA256: ddf77b391aae825726bcbd7cc2f81726e0dcd0a77690fb738ad90b108c8dda63'
          git push origin HEAD:refs/heads/feature-hcc
          python3 -c "import json, subprocess; from pathlib import Path; Path('hcc-publication.json').write_text(json.dumps({'commit': subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'tree': subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),'patch_sha256':'ddf77b391aae825726bcbd7cc2f81726e0dcd0a77690fb738ad90b108c8dda63'},indent=2))"
      - uses: actions/upload-artifact@v4
        with:
          name: hcc-publication
          path: hcc-publication.json
          if-no-files-found: error
          retention-days: 7
