name: HER v3 branch sandbox

on:
  push:
    branches: [exp-herv2j]
    paths:
      - '.github/workflows/herv3-sandbox.yml'
      - '.herv3.patch'

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Export tracked experiment source only
        run: git archive --format=tar.gz HEAD > "$RUNNER_TEMP/herv3-source.tar.gz"
      - name: Download small offline-test dependencies
        run: |
          python -m pip download --only-binary=:all: --dest "$RUNNER_TEMP/herv3-wheels" python-telegram-bot croniter ruff
      - uses: actions/upload-artifact@v4
        with:
          name: herv3-source
          path: ${{ runner.temp }}/herv3-source.tar.gz
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: herv3-test-wheels
          path: ${{ runner.temp }}/herv3-wheels
          retention-days: 1
