name: vision-inspect-cross-platform

on:
  push:
    paths:
      - "agents.json.sample"
      - "orchestrator/flexible_backend_manager.py"
      - "tools/registry.py"
      - "tools/vision_inspect.py"
      - "tests/test_vision_inspect.py"
      - ".github/workflows/vision-inspect-cross-platform.yml"
  pull_request:
    paths:
      - "agents.json.sample"
      - "orchestrator/flexible_backend_manager.py"
      - "tools/registry.py"
      - "tools/vision_inspect.py"
      - "tests/test_vision_inspect.py"
      - ".github/workflows/vision-inspect-cross-platform.yml"

permissions:
  contents: read

jobs:
  vision-inspect:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: python -m pip install -r requirements.txt
      - name: Run vision and configuration regression tests
        run: >-
          python -m pytest -q
          tests/test_vision_inspect.py
          tests/test_her_v2_runtime_configuration.py
