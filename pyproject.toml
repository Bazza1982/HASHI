[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hashi-bridge"
version = "4.0.0a2"
description = "HASHI — Universal AI Agent Orchestration Platform. Privacy-first, multi-backend, multi-agent system."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "HASHI Team", email = "barrytianli@gmail.com"}
]
keywords = [
    "ai", "agent", "orchestration", "claude", "gemini", "codex",
    "telegram", "whatsapp", "multi-agent", "automation"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "python-telegram-bot>=20.0",
    "httpx>=0.24.0",
    "aiohttp>=3.8.0",
    "PyYAML>=6.0",
    "jsonschema>=4.20.0,<5.0.0",
    "croniter>=1.3.0",
]

[project.optional-dependencies]
standard = [
    "pillow>=12.2.0",
    "PyMuPDF>=1.26.0,<2.0.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "zeroconf>=0.136.0",
    "cryptography>=45.0.0",
    "rich>=13.0.0",
    "textual>=0.50.0",
]
media = [
    "pillow>=12.2.0",
    "PyMuPDF>=1.26.0,<2.0.0",
]
remote = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "zeroconf>=0.136.0",
    "cryptography>=45.0.0",
]
tui = [
    "rich>=13.0.0",
    "textual>=0.50.0",
]
test = [
    "pytest>=9.0.3,<10.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx2>=2.12.0,<3.0.0",
    "build>=1.3.0,<2.0.0",
    "setuptools>=77.0.0",
    "wheel>=0.45.0",
]
whatsapp = [
    "neonize>=0.4.3.post0,<0.5.0",
    "segno>=1.6.0",
]
browser = ["playwright>=1.40.0"]
voice = [
    "edge-tts>=6.0.0",
    "piper-tts>=1.0.0",
]
transcription = ["faster-whisper>=1.0.0"]
ocr = [
    "paddleocr==3.7.0",
    "paddlepaddle==3.3.1",
]
kubernetes = ["kubernetes>=29.0.0,<32.0.0"]
postgres = [
    "psycopg[binary]>=3.1.0",
    "psycopg-pool>=3.2.0",
]
vector = [
    "sqlite-vec>=0.1.6",
    "onnxruntime>=1.18.0",
    "transformers>=4.44.0",
    "tokenizers>=0.19.0",
]
all = [
    "pillow>=12.2.0",
    "PyMuPDF>=1.26.0,<2.0.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "zeroconf>=0.136.0",
    "cryptography>=45.0.0",
    "rich>=13.0.0",
    "textual>=0.50.0",
    "neonize>=0.4.3.post0,<0.5.0",
    "segno>=1.6.0",
    "playwright>=1.40.0",
    "edge-tts>=6.0.0",
    "piper-tts>=1.0.0",
    "faster-whisper>=1.0.0",
    "paddleocr==3.7.0",
    "paddlepaddle==3.3.1",
    "kubernetes>=29.0.0,<32.0.0",
    "psycopg[binary]>=3.1.0",
    "psycopg-pool>=3.2.0",
    "sqlite-vec>=0.1.6",
    "onnxruntime>=1.18.0",
    "transformers>=4.44.0",
    "tokenizers>=0.19.0",
]

[project.urls]
Homepage = "https://github.com/Bazza1982/hashi"
Repository = "https://github.com/Bazza1982/hashi"
Issues = "https://github.com/Bazza1982/hashi/issues"

[project.scripts]
nagare = "nagare.cli:main"

[tool.hashi.runtime]
# This is the sole machine-readable owner of the HASHI Core runtime contract.
# Packaging metadata, launchers, containers, CI, and release documentation are
# checked against it; ordinary function generations cannot override it.
implementation = "cpython"
python = "3.12.13"
standard-lock = "constraints/standard-py312.lock"
portable-build-date = "20260303"
core-api = 2
function-api = 2
worker-model = "per-agent-process"
worker-protocol = 1
generation-schema = 2

[tool.setuptools.packages.find]
include = ["flow*", "nagare*"]

[tool.pytest.ini_options]
# Bare pytest is the fast, deterministic core gate. Explicit paths always
# override this list; wider scopes are selected explicitly by path and marker.
addopts = ["--strict-markers"]
testpaths = [
    "tests/test_api_gateway_preflight.py",
    "tests/test_api_gateway_tool_passthrough.py",
    "tests/test_agent_lifecycle.py",
    "tests/test_architecture_boundaries.py",
    "tests/test_capability_broker.py",
    "tests/test_browser_extension_identity.py",
    "tests/test_codex_api_tool_bridge.py",
    "tests/test_command_registry.py",
    "tests/test_dependency_profiles.py",
    "tests/test_device_control_worker.py",
    "tests/test_device_paths.py",
    "tests/test_her_v2_adapter.py",
    "tests/test_her_v2_core.py",
    "tests/test_function_contract.py",
    "tests/test_function_generation.py",
    "tests/test_function_worker_protocol.py",
    "tests/test_function_worker_supervisor.py",
    "tests/test_hchat_send.py",
    "tests/test_manager_registry.py",
    "tests/test_model_catalog.py",
    "tests/test_protocol_ack.py",
    "tests/test_request_activity.py",
    "tests/test_reboot_manager.py",
    "tests/test_runtime_command_binding.py",
    "tests/test_runtime_working_modes.py",
    "tests/test_runtime_lifecycle.py",
    "tests/test_runtime_contract.py",
    "tests/test_service_manager_scheduler_lease.py",
    "tests/test_service_endpoints.py",
    "tests/test_smart_tool_registry.py",
    "tests/test_telegram_ingress.py",
    "tests/test_tool_registry_device_capabilities.py",
    "tests/test_workbench_enterprise_health.py",
    "tests/test_workbench_device_capabilities.py",
    "tests/test_workspace_state.py",
]
python_files = ["test_*.py"]
norecursedirs = [
    ".git",
    ".venv",
    "build",
    "dist",
    "logs",
    "superloops",
    "tmp",
    "workspaces",
]
markers = [
    "contract: release, packaging, or cross-component contract",
    "integration: deterministic integration with subprocesses or multiple components",
    "live: requires an explicitly authorized external service or mutable live system",
    "platform: requires a named operating system or platform facility",
    "real_wall_clock: deliberately crosses a historical real-time execution boundary",
]

[tool.ruff.lint]
# Keep the release gate focused on syntax, imports, and executable-code errors.
# Broader style families can be adopted separately without turning historical
# formatting preferences into release blockers.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Standalone entry points must add the checkout root before importing HASHI.
"scripts/check_vector_upgrade.py" = ["E402"]
"scripts/hermes_transfer.py" = ["E402"]
"scripts/link_whatsapp.py" = ["E402"]
"scripts/migrate_vectors.py" = ["E402"]
"scripts/move_agent.py" = ["E402"]
"scripts/path_portability_tool.py" = ["E402"]
"scripts/send_whatsapp_test.py" = ["E402"]
"tools/protocol_send.py" = ["E402"]
"tools/remote_file_transfer.py" = ["E402"]
"tools/run_api_gateway_sidecar.py" = ["E402"]
"tui.py" = ["E402"]
"tui_onboarding.py" = ["E402"]

# These tests install dependency stubs before importing runtime modules.
"tests/test_agent_runtime_job_transfer.py" = ["E402"]
"tests/test_anatta_audit_compatibility.py" = ["E402"]
"tests/test_audit_mode.py" = ["E402"]
"tests/test_browser_mode.py" = ["E402"]
"tests/test_flexible_runtime_observers.py" = ["E402"]
"tests/test_pcm_audit_memory_wiki.py" = ["E402"]
"tests/test_pcm_fixed_gateway.py" = ["E402"]
"tests/test_remote_lifecycle.py" = ["E402"]
"tests/test_usecomputer_mode.py" = ["E402"]

# The Obsidian schema block is appended after the base catalog is constructed.
"tools/schemas.py" = ["E402"]
