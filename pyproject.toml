[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hashi-bridge"
version = "0.1.0a1"
description = "HASHI — Universal AI Agent Orchestration Platform. Privacy-first, multi-backend, multi-agent system."
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "HASHI Team", email = "barrytianli@gmail.com"}
]
keywords = [
    "ai", "agent", "orchestration", "claude", "gemini", "codex",
    "telegram", "whatsapp", "multi-agent", "automation"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.10"
dependencies = [
    "python-telegram-bot>=20.0",
    "httpx>=0.24.0",
    "aiohttp>=3.8.0",
    "PyYAML>=6.0",
    "jsonschema>=4.20.0,<5.0.0",
    "croniter>=1.3.0",
]

[project.optional-dependencies]
standard = [
    "pillow>=12.2.0",
    "PyMuPDF>=1.26.0,<2.0.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "zeroconf>=0.136.0",
    "cryptography>=45.0.0",
    "rich>=13.0.0",
    "textual>=0.50.0",
]
media = [
    "pillow>=12.2.0",
    "PyMuPDF>=1.26.0,<2.0.0",
]
remote = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "zeroconf>=0.136.0",
    "cryptography>=45.0.0",
]
tui = [
    "rich>=13.0.0",
    "textual>=0.50.0",
]
test = [
    "pytest>=9.0.3,<10.0.0",
    "pytest-asyncio>=0.23.0",
    "tomli>=2.0.0; python_version < '3.11'",
]
whatsapp = [
    "neonize>=1.0.0",
    "segno>=1.6.0",
]
browser = ["playwright>=1.40.0"]
voice = [
    "edge-tts>=6.0.0",
    "piper-tts>=1.0.0",
]
transcription = ["faster-whisper>=1.0.0"]
ocr = [
    "paddleocr==3.7.0",
    "paddlepaddle==3.3.1",
]
kubernetes = ["kubernetes>=29.0.0,<32.0.0"]
postgres = [
    "psycopg[binary]>=3.1.0",
    "psycopg-pool>=3.2.0",
]
vector = [
    "sqlite-vec>=0.1.6",
    "onnxruntime>=1.18.0",
    "transformers>=4.44.0",
    "tokenizers>=0.19.0",
]
all = [
    "pillow>=12.2.0",
    "PyMuPDF>=1.26.0,<2.0.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "zeroconf>=0.136.0",
    "cryptography>=45.0.0",
    "rich>=13.0.0",
    "textual>=0.50.0",
    "neonize>=1.0.0",
    "segno>=1.6.0",
    "playwright>=1.40.0",
    "edge-tts>=6.0.0",
    "piper-tts>=1.0.0",
    "faster-whisper>=1.0.0",
    "paddleocr==3.7.0",
    "paddlepaddle==3.3.1",
    "kubernetes>=29.0.0,<32.0.0",
    "psycopg[binary]>=3.1.0",
    "psycopg-pool>=3.2.0",
    "sqlite-vec>=0.1.6",
    "onnxruntime>=1.18.0",
    "transformers>=4.44.0",
    "tokenizers>=0.19.0",
]

[project.urls]
Homepage = "https://github.com/Bazza1982/hashi"
Repository = "https://github.com/Bazza1982/hashi"
Issues = "https://github.com/Bazza1982/hashi/issues"

[project.scripts]
nagare = "nagare.cli:main"

[tool.setuptools.packages.find]
include = ["flow*", "nagare*"]

[tool.pytest.ini_options]
# Bare pytest is the fast, deterministic core gate. Explicit paths always
# override this list; wider scopes are selected explicitly by path and marker.
addopts = ["--strict-markers"]
testpaths = [
    "tests/test_api_gateway_preflight.py",
    "tests/test_api_gateway_tool_passthrough.py",
    "tests/test_architecture_boundaries.py",
    "tests/test_codex_api_tool_bridge.py",
    "tests/test_command_registry.py",
    "tests/test_her_v2_adapter.py",
    "tests/test_her_v2_core.py",
    "tests/test_hot_reload.py",
    "tests/test_manager_registry.py",
    "tests/test_model_catalog.py",
    "tests/test_protocol_ack.py",
    "tests/test_request_activity.py",
    "tests/test_runtime_command_binding.py",
    "tests/test_runtime_lifecycle.py",
]
python_files = ["test_*.py"]
norecursedirs = [
    ".git",
    ".venv",
    "build",
    "dist",
    "logs",
    "superloops",
    "tmp",
    "workspaces",
]
markers = [
    "contract: release, packaging, or cross-component contract",
    "integration: deterministic integration with subprocesses or multiple components",
    "live: requires an explicitly authorized external service or mutable live system",
    "platform: requires a named operating system or platform facility",
    "real_wall_clock: deliberately crosses a historical real-time execution boundary",
]
