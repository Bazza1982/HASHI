# HASHI Flow — Meta-Workflow
# Produces a reviewed, self-contained Nagare workflow bundle without installing it.

workflow:
  id: meta-workflow-creation
  name: "工作流创建工作流"
  version: "2.0.0"
  description: |
    将自然语言需求转换为可审查的 Nagare 工作流发布包。
    所有生成内容保留在运行工件中；安装或发布必须由用户或宿主显式完成。
  tags: [meta, system, workflow-creation]

meta:
  created_by: human
  created_at: "2026-03-26T06:00:00Z"
  previous_version: "1.7.0"
  source_prompt: "系统核心工作流，手动创建"

changelog:
  - version: "2.0.0"
    date: "2026-09-06"
    changes: |
      移除旧版自修改、虚构成本/质量和不存在知识库路径的指令。
      生成内容改为受管工件，并增加实际 bundle 验证、独立审查和发布清单。
      model 改为使用各 CLI 的已配置默认值，避免模板绑定易过期的 model ID。

pre_flight:
  collect_from_human:
    - key: task_description
      question: "请详细描述要由新工作流完成的任务。"
      required: true
      type: text
    - key: source_files
      question: "是否有需要新工作流处理的输入类型或示例路径？"
      required: false
      type: text
  defaults:
    quality_requirement: "high"
    maximum_design_questions: 5

agents:
  orchestrator:
    id: flow-runner
    human_interface: akane
  workers:
    - id: analyst_01
      role: "需求与证据分析"
      agent_md: "flow/agents/analyst/AGENT.md"
      backend: claude-cli
    - id: questioner_01
      role: "设计问题筛选"
      agent_md: "flow/agents/questioner/AGENT.md"
      backend: claude-cli
    - id: integrator_01
      role: "回答与安全默认值集成"
      agent_md: "flow/agents/integrator/AGENT.md"
      backend: claude-cli
    - id: designer_01
      role: "Nagare 工作流设计与打包"
      agent_md: "flow/agents/designer/AGENT.md"
      backend: claude-cli
    - id: critic_01
      role: "设计反方审查"
      agent_md: "flow/agents/critic/AGENT.md"
      backend: codex-cli
    - id: validator_01
      role: "运行契约验证"
      agent_md: "flow/agents/validator/AGENT.md"
      backend: claude-cli
    - id: reviewer_01
      role: "独立发布审查"
      agent_md: "flow/agents/reviewer/AGENT.md"
      backend: codex-cli
    - id: debug_01
      role: "故障诊断与恢复"
      agent_md: "flow/agents/debug/AGENT.md"
      backend: claude-cli

steps:
  - id: analyze_requirements
    name: "分析任务与信息缺口"
    agent: analyst_01
    depends: []
    input:
      params:
        task_description: "{pre_flight.task_description}"
        source_files: "{pre_flight.source_files}"
    prompt: |
      分析任务、输入边界、可验证完成条件和风险，写入 task_analysis.json。
      将信息缺口逐项标为 design_time、runtime 或 implementation_detail。
      只有 design_time 缺口需要当前用户决定；runtime 输入应由新工作流自己的
      pre_flight 收集。不要生成主观成本、耗时、置信度或质量分数。

      task_analysis.json 至少包含：
      {
        "task_summary": "...",
        "required_capabilities": [],
        "proposed_completion_evidence": [],
        "information_gaps": [
          {
            "key": "...",
            "description": "...",
            "parameter_layer": "design_time|runtime|implementation_detail",
            "can_assume": false,
            "safe_default": null
          }
        ],
        "risks": []
      }
    output:
      artifacts:
        - key: task_analysis
          path: task_analysis.json
          type: json

  - id: generate_design_questions
    name: "筛选必要设计问题"
    agent: questioner_01
    depends: [analyze_requirements]
    wait_for_human: true
    input:
      from_artifacts: [task_analysis]
      params:
        maximum_questions: "{pre_flight.maximum_design_questions}"
    prompt: |
      读取 task_analysis.json。只询问会实质改变 DAG、权限、副作用或完成条件的
      design_time 问题，最多 {pre_flight.maximum_design_questions} 个。
      runtime 缺口转为新工作流 pre_flight 建议；implementation_detail 只有在存在
      明确安全默认值时才自动解析。

      写入 question_set.json：
      {
        "clarification_questions": [],
        "question_details": [],
        "runtime_inputs": [],
        "auto_resolved": []
      }
    output:
      artifacts:
        - key: question_set
          path: question_set.json
          type: json

  - id: integrate_design_context
    name: "集成设计上下文"
    agent: integrator_01
    depends: [generate_design_questions]
    input:
      from_artifacts: [task_analysis, question_set]
      params:
        human_responses: "{pre_flight}"
    prompt: |
      合并任务分析、问题集与 human_responses，写入 preflight_context.json。
      明确回答优先于默认值；不得替用户决定未回答且不可安全假设的事项。

      输出：
      {
        "resolved": {},
        "assumptions": [],
        "blocking_issues": [],
        "ready_for_design": true
      }
    output:
      artifacts:
        - key: preflight_context
          path: preflight_context.json
          type: json
    quality_gate:
      type: auto
      criteria:
        - "preflight_context.ready_for_design == true"

  - id: design_workflow
    name: "设计 Nagare 工作流"
    agent: designer_01
    depends: [integrate_design_context]
    input:
      from_artifacts: [task_analysis, question_set, preflight_context]
    prompt: |
      设计一个符合当前 Nagare 运行契约的完整工作流，并写入 design_package.json。
      包中必须包含 workflow.yaml 的完整文本、每个 AGENT.md 的相对路径与完整文本、
      DAG 说明、每项完成条件如何由 required artifact 或 auto quality_gate 强制执行，
      以及所有外部依赖和副作用。

      当前后端仅有 claude-cli、codex-cli、callable。model 可省略并使用 CLI 默认值。
      subprocess 工件路径必须相对 worker workspace。不要加入固定执行超时、固定恢复
      次数、workspace、controllable_by 或 auto_apply。不要声称已验证尚未创建的文件。
    output:
      artifacts:
        - key: design_package
          path: design_package.json
          type: json

  - id: critique_design
    name: "挑战设计假设"
    agent: critic_01
    depends: [design_workflow]
    input:
      from_artifacts: [task_analysis, preflight_context, design_package]
    prompt: |
      从需求遗漏、无效依赖、无法执行的路径、权限与副作用、不可验证完成条件、
      过度复杂和发布可移植性七个方面审查设计，写入 critique_report.json。
      每项 blocker 必须引用具体证据并给出最小修正；没有证据时不要制造问题或分数。
    output:
      artifacts:
        - key: critique_report
          path: critique_report.json
          type: json

  - id: create_workflow_bundle
    name: "创建候选工作流包"
    agent: designer_01
    depends: [critique_design]
    input:
      from_artifacts: [design_package, critique_report]
    prompt: |
      根据 design_package.json 创建目录 generated_workflow/，其中包含 workflow.yaml
      和它引用的全部 AGENT.md。逐项处理 critique_report.json 的 blocker；在
      creation_report.json 中记录 accepted、rejected 或 deferred，并为拒绝/延期提供
      证据。计算并记录实际生成文件的 SHA-256。

      不要写入 HASHI 源码目录，不要安装或激活工作流。所有文件必须位于当前 worker
      workspace 的 generated_workflow/ 内。
    output:
      artifacts:
        - key: generated_workflow
          path: generated_workflow
          type: directory
        - key: creation_report
          path: creation_report.json
          type: json

  - id: validate_workflow_bundle
    name: "验证实际生成包"
    agent: validator_01
    depends: [create_workflow_bundle]
    input:
      from_artifacts: [generated_workflow, creation_report]
    prompt: |
      对 generated_workflow 中的真实文件执行当前 Nagare 契约检查。验证 YAML、
      重复 key、ID、DAG、artifact 生产关系、backend、AGENT.md 路径、相对输出路径、
      retired 字段以及阻断条件。重新计算 checksum 并与 creation_report 对比。

      写入 validation_report.json：
      {
        "valid": true,
        "checks_performed": [],
        "blocking_issues": [],
        "warnings": [],
        "checksum_mismatches": []
      }
      无论 valid 值如何都先写出报告并返回 completed；质量门负责阻断无效包。
    output:
      artifacts:
        - key: validation_report
          path: validation_report.json
          type: json
    quality_gate:
      type: auto
      criteria:
        - "validation_report.valid == true"

  - id: independent_release_review
    name: "独立发布审查"
    agent: reviewer_01
    depends: [validate_workflow_bundle]
    input:
      from_artifacts:
        [task_analysis, preflight_context, generated_workflow, creation_report, validation_report]
    prompt: |
      独立检查实际生成包是否满足原始需求、完成条件和当前运行契约。核验而不是复述
      validation_report。写入 review_report.json：
      {
        "overall_verdict": "approve|reject",
        "blocking_issues": [],
        "evidence": [],
        "advisory_notes": []
      }
      无论 verdict 值如何都先写出报告并返回 completed；质量门负责阻断 reject。
    output:
      artifacts:
        - key: review_report
          path: review_report.json
          type: json
    quality_gate:
      type: auto
      criteria:
        - "review_report.overall_verdict == 'approve'"

  - id: package_release
    name: "生成可交付发布包"
    agent: designer_01
    depends: [independent_release_review]
    input:
      from_artifacts: [generated_workflow, creation_report, validation_report, review_report]
    prompt: |
      将已批准的 generated_workflow 复制到 release_bundle/，并把验证报告、审查报告
      与 RELEASE_MANIFEST.json 一并放入。清单必须列出版本、相对文件路径、SHA-256、
      外部依赖、已执行检查和仍需操作员决定的事项。

      同时在 worker workspace 根目录写出 release_manifest.json。不要安装、激活、
      推送或覆盖任何仓库文件。
    output:
      artifacts:
        - key: release_bundle
          path: release_bundle
          type: directory
        - key: release_manifest
          path: release_manifest.json
          type: json

error_handling:
  debug_agent: debug_01
  on_unrecoverable:
    action: notify_human_interface
    target: akane
    message: "工作流设计步骤无法恢复：{failed_step_id}，错误：{error}"

success_criteria:
  - "preflight_context.ready_for_design == true"
  - "validation_report.valid == true"
  - "review_report.overall_verdict == 'approve'"
  - "release_bundle 和 release_manifest 均已作为 required artifacts 注册"

output:
  type: directory
  source_artifact: release_bundle
  notify_agent: akane
  message_template: |
    工作流发布包已生成并通过契约验证与独立审查。
    核验 release_manifest 后，由操作员决定是否安装或发布。

evaluation:
  enabled: true
  metrics:
    - total_duration
    - completed_steps
    - failed_steps
    - debug_interventions
    - human_interventions
