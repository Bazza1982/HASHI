[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.3"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
serde_json = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "allow", priority = -1 }
module_name_repetitions = "allow"
missing_panics_doc = "allow"
missing_errors_doc = "allow"

# Local development profile used by HASHI `/rebuild`.  It keeps release-mode
# behaviour while favouring incremental rebuild speed and useful diagnostics.
[profile.hashi-dev]
inherits = "release"
opt-level = 1
debug = 1
incremental = true
lto = false
codegen-units = 16
